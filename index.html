<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>実技試験 採点</title>
<style>
  :root{
    --bg:#F5F7F4;
    --surface:#FFFFFF;
    --ink:#182430;
    --ink-soft:#5B6B72;
    --line:#DCE3DE;
    --teal:#1F6F5C;
    --teal-dark:#134338;
    --teal-tint:#E7F1EE;
    --amber:#C97A2B;
    --amber-tint:#FBEEDF;
    --danger:#B3261E;
    --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font);background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
  }
  #screen{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:18px 16px 40px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  header .title{font-size:16px;font-weight:700;}
  header .crumbs{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .backBtn{background:none;border:none;color:var(--teal-dark);font-size:14px;padding:8px 4px;cursor:pointer;font-weight:600;}
  .step{display:none;flex:1;flex-direction:column;}
  .step.active{display:flex;}
  h2{font-size:18px;margin:6px 0 16px;}
  .subnote{color:var(--ink-soft);font-size:13px;margin-bottom:16px;}

  .bigList{display:flex;flex-direction:column;gap:10px;}
  .bigBtn{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:18px 18px;font-size:17px;font-weight:600;color:var(--ink);
    cursor:pointer;text-align:left;-webkit-user-select:none;user-select:none;
  }
  .bigBtn:active{background:var(--teal-tint);border-color:var(--teal);}
  .bigBtn .sub{font-size:12.5px;color:var(--ink-soft);font-weight:400;margin-top:3px;}
  .bigBtn .chev{color:var(--ink-soft);font-size:20px;}

  .studentRow{
    display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:10px;
    padding:14px 16px;margin-bottom:9px;cursor:pointer;
  }
  .studentRow.done{border-left-color:var(--teal);}
  .studentRow:active{background:#F2F6F3;}
  .studentRow .mark{font-size:20px;width:24px;text-align:center;color:var(--amber);flex:none;}
  .studentRow.done .mark{color:var(--teal);}
  .studentRow .info{flex:1;min-width:0;}
  .studentRow .name{font-size:16.5px;font-weight:700;}
  .studentRow .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .studentRow .score{font-size:15px;font-weight:700;color:var(--teal-dark);flex:none;}

  .progressLine{display:flex;justify-content:space-between;align-items:center;background:var(--teal-tint);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;color:var(--teal-dark);font-weight:600;}

  /* 採点画面 */
  .scoreCard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;}
  .scoreCard .sname{font-size:22px;font-weight:700;margin-bottom:4px;}
  .scoreCard .smeta{color:var(--ink-soft);font-size:14px;margin-bottom:20px;}
  .scoreDisplay{
    font-size:56px;font-weight:800;color:var(--teal-dark);
    background:var(--teal-tint);border-radius:14px;padding:14px 0;margin-bottom:18px;letter-spacing:.02em;
  }
  .scoreDisplay.empty{color:var(--ink-soft);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .keypad button{
    font-size:22px;font-weight:700;padding:16px 0;border-radius:12px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;
  }
  .keypad button:active{background:var(--teal-tint);}
  .keypad button.wide{grid-column:span 1;}
  .presetRow{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;}
  .presetRow button{
    border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-size:14px;cursor:pointer;
  }
  .saveBtn{
    width:100%;padding:18px;font-size:18px;font-weight:700;border:none;border-radius:12px;
    background:var(--teal);color:#fff;cursor:pointer;
  }
  .saveBtn:disabled{background:#B9C6C0;cursor:not-allowed;}
  .saveBtn:active:not(:disabled){background:var(--teal-dark);}

  .footerLinks{margin-top:auto;padding-top:18px;display:flex;justify-content:center;gap:18px;}
  .footerLinks button{background:none;border:none;color:var(--ink-soft);font-size:13px;text-decoration:underline;cursor:pointer;}

  #loadingOverlay{
    position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;z-index:50;
  }
  #loadingOverlay .msg{color:var(--ink-soft);font-size:14px;}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99;}
  .toast-item{background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.25);margin-top:8px;}
  .toast-item.err{background:var(--danger);}
  .toast-item.ok{background:var(--teal-dark);}
  .emptyMsg{color:var(--ink-soft);font-size:14px;text-align:center;padding:30px 10px;}
  .doneBanner{background:var(--teal-tint);color:var(--teal-dark);border-radius:12px;padding:16px;text-align:center;font-weight:600;margin-bottom:14px;}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="msg" id="loadingMsg">読み込み中です…</div>
</div>

<div id="screen" style="display:none;">
  <header>
    <div>
      <div class="title">実技試験 採点</div>
      <div class="crumbs" id="crumbs"></div>
    </div>
    <button class="backBtn" id="backBtn" style="display:none;">戻る</button>
  </header>

  <!-- STEP 1: 試験選択 -->
  <div class="step active" id="step-exam">
    <h2>試験を選んでください</h2>
    <div class="bigList" id="examList"></div>
    <div id="examEmptyMsg" class="emptyMsg" style="display:none;">現在選択できる試験がありません。管理者にご確認ください。</div>
  </div>

  <!-- STEP 2: 先生名選択 -->
  <div class="step" id="step-teacher">
    <h2>あなたの名前を選んでください</h2>
    <div class="bigList" id="teacherList"></div>
  </div>

  <!-- STEP 3: 楽器選択 -->
  <div class="step" id="step-instrument">
    <h2>採点する楽器を選んでください</h2>
    <div class="bigList" id="instrumentList"></div>
  </div>

  <!-- STEP 4: 生徒一覧 -->
  <div class="step" id="step-students">
    <h2 id="studentsHeading">生徒一覧</h2>
    <div class="progressLine" id="progressLine"></div>
    <div id="studentsListWrap"></div>
    <div class="footerLinks">
      <button id="changeInstrumentBtn">楽器を変更する</button>
      <button id="changeTeacherBtn">先生を変更する</button>
    </div>
  </div>

  <!-- STEP 5: 採点 -->
  <div class="step" id="step-score">
    <div class="scoreCard">
      <div class="sname" id="scoreStudentName"></div>
      <div class="smeta" id="scoreStudentMeta"></div>
      <div class="scoreDisplay empty" id="scoreDisplay">--</div>
      <div class="presetRow" id="presetRow"></div>
      <div class="keypad" id="keypad"></div>
      <button class="saveBtn" id="saveScoreBtn" disabled>採点を保存</button>
    </div>
    <div class="footerLinks">
      <button id="backToListBtn">生徒一覧に戻る</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc,
  query, where, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* =========================================================
   Firebase 設定 : admin.html と同じ値を設定してください
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDy6ubn4A1-6JHsPRw8sdj0wXcwAC42SlM",
  authDomain: "zitugi.firebaseapp.com",
  projectId: "zitugi",
  storageBucket: "zitugi.firebasestorage.app",
  messagingSenderId: "143311521930",
  appId: "1:143311521930:web:f3b1d176046fe0e96d0573"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function toast(msg, type=''){
  const el = document.createElement('div');
  el.className = 'toast-item' + (type ? ' '+type : '');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(()=>el.remove(), 3600);
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

const state = {
  exams: [],
  teachers: [],
  exam: null,          // {id, examName, examDate, status}
  teacher: null,        // {id, teacherName}
  targets: [],          // 選択中の試験の対象生徒 全体
  instrument: null,
  filteredStudents: [], // instrument絞り込み後・ソート済み
  myScores: {},          // studentId -> score
  currentStudent: null,
  scoreValue: '',
};

let unsubMyScores = null;

/* ========================= 起動 ========================= */
boot().catch(err => {
  $('#loadingMsg').textContent = '読み込みに失敗しました。ネットワークをご確認の上、再読み込みしてください。';
  console.error(err);
});

async function boot(){
  const examsSnap = await getDocs(collection(db,'exams'));
  state.exams = examsSnap.docs.map(d => ({ id:d.id, ...d.data() }))
    .filter(e => e.status !== '終了')
    .sort((a,b) => (b.examDate||'').localeCompare(a.examDate||''));
  const teachersSnap = await getDocs(collection(db,'teachers'));
  state.teachers = teachersSnap.docs.map(d => ({ id:d.id, ...d.data() }));

  renderExamList();
  $('#loadingOverlay').style.display = 'none';
  $('#screen').style.display = 'block';
}

/* ========================= ステップ管理 ========================= */
const STEP_ORDER = ['exam','teacher','instrument','students','score'];
function showStep(name){
  STEP_ORDER.forEach(s => $('#step-'+s).classList.toggle('active', s === name));
  $('#backBtn').style.display = name === 'exam' ? 'none' : 'inline-block';
  updateCrumbs(name);
}
function updateCrumbs(name){
  const parts = [];
  if(state.exam) parts.push(state.exam.examName);
  if(state.teacher) parts.push(state.teacher.teacherName + '先生');
  if(state.instrument && (name==='students' || name==='score')) parts.push(state.instrument);
  $('#crumbs').textContent = parts.join(' ／ ');
}
$('#backBtn').onclick = () => {
  const cur = STEP_ORDER.find(s => $('#step-'+s).classList.contains('active'));
  const idx = STEP_ORDER.indexOf(cur);
  if(idx > 0) showStep(STEP_ORDER[idx-1]);
};

/* ========================= STEP1: 試験選択 ========================= */
function renderExamList(){
  const list = $('#examList');
  if(state.exams.length === 0){
    $('#examEmptyMsg').style.display = 'block';
    return;
  }
  list.innerHTML = state.exams.map(ex => `
    <div class="bigBtn" data-id="${ex.id}">
      <div>
        ${escapeHtml(ex.examName)}
        <div class="sub">${escapeHtml(ex.examDate||'')}　${escapeHtml(ex.status||'')}</div>
      </div>
      <div class="chev">›</div>
    </div>
  `).join('');
  $$('.bigBtn', list).forEach(el => {
    el.onclick = () => selectExam(el.dataset.id);
  });
}

async function selectExam(examId){
  state.exam = state.exams.find(e => e.id === examId);
  const targetsSnap = await getDocs(collection(db,'exams', examId, 'targets'));
  state.targets = targetsSnap.docs.map(d => ({ id:d.id, ...d.data() })).filter(t => t.included);
  renderTeacherList();
  showStep('teacher');
}

/* ========================= STEP2: 先生選択 ========================= */
function renderTeacherList(){
  const list = $('#teacherList');
  list.innerHTML = state.teachers.map(t => `
    <div class="bigBtn" data-id="${t.id}">
      <div>${escapeHtml(t.teacherName)}</div>
      <div class="chev">›</div>
    </div>
  `).join('');
  $$('.bigBtn', list).forEach(el => {
    el.onclick = () => selectTeacher(el.dataset.id);
  });
}

function selectTeacher(teacherId){
  const t = state.teachers.find(x => x.id === teacherId);
  state.teacher = t;
  renderInstrumentList();
  showStep('instrument');
}

$('#changeTeacherBtn').onclick = () => { renderTeacherList(); showStep('teacher'); };

/* ========================= STEP3: 楽器選択 ========================= */
function renderInstrumentList(){
  const instruments = [...new Set(state.targets.map(t => t.instrument))];
  const list = $('#instrumentList');
  if(instruments.length === 0){
    list.innerHTML = '<div class="emptyMsg">この試験には対象生徒が登録されていません。</div>';
    return;
  }
  list.innerHTML = instruments.map(inst => {
    const count = state.targets.filter(t => t.instrument === inst).length;
    return `<div class="bigBtn" data-inst="${escapeHtml(inst)}">
      <div>${escapeHtml(inst)}<div class="sub">${count}名</div></div>
      <div class="chev">›</div>
    </div>`;
  }).join('');
  $$('.bigBtn', list).forEach(el => {
    el.onclick = () => selectInstrument(el.dataset.inst);
  });
}

function selectInstrument(inst){
  state.instrument = inst;
  state.filteredStudents = state.targets
    .filter(t => t.instrument === inst)
    .sort((a,b) => a.grade - b.grade || a.attendanceNumber - b.attendanceNumber);
  subscribeMyScores();
  showStep('students');
}
$('#changeInstrumentBtn').onclick = () => { renderInstrumentList(); showStep('instrument'); };

/* ========================= 採点データ購読 ========================= */
function subscribeMyScores(){
  if(unsubMyScores) unsubMyScores();
  const q = query(
    collection(db,'scores'),
    where('examId','==', state.exam.id),
    where('teacherId','==', state.teacher.id)
  );
  unsubMyScores = onSnapshot(q, snap => {
    state.myScores = {};
    snap.docs.forEach(d => { state.myScores[d.data().studentId] = d.data().score; });
    renderStudentList();
  }, err => {
    console.error(err);
    toast('採点状況の取得に失敗しました', 'err');
  });
}

/* ========================= STEP4: 生徒一覧 ========================= */
function renderStudentList(){
  $('#studentsHeading').textContent = `${state.instrument} の生徒`;
  const total = state.filteredStudents.length;
  const done = state.filteredStudents.filter(s => state.myScores[s.id] !== undefined).length;
  $('#progressLine').innerHTML = `<span>採点済み ${done} / ${total} 人</span><span>${done===total && total>0 ? '全員採点済みです' : ''}</span>`;

  const wrap = $('#studentsListWrap');
  if(total === 0){
    wrap.innerHTML = '<div class="emptyMsg">この楽器の対象生徒がいません。</div>';
    return;
  }
  wrap.innerHTML = state.filteredStudents.map(s => {
    const scored = state.myScores[s.id] !== undefined;
    return `<div class="studentRow ${scored?'done':''}" data-id="${s.id}">
      <div class="mark">${scored ? '✓' : '○'}</div>
      <div class="info">
        <div class="name">${escapeHtml(s.name)}</div>
        <div class="meta">${s.grade}年 ${s.attendanceNumber}番</div>
      </div>
      <div class="score">${scored ? state.myScores[s.id] + '点' : ''}</div>
    </div>`;
  }).join('');
  $$('.studentRow', wrap).forEach(el => {
    el.onclick = () => openScoreScreen(el.dataset.id);
  });
}

/* ========================= STEP5: 採点画面 ========================= */
function openScoreScreen(studentId){
  const student = state.filteredStudents.find(s => s.id === studentId);
  if(!student) return;
  state.currentStudent = student;
  const existing = state.myScores[studentId];
  state.scoreValue = existing !== undefined ? String(existing) : '';
  renderScoreScreen();
  showStep('score');
}

function renderScoreScreen(){
  const s = state.currentStudent;
  $('#scoreStudentName').textContent = s.name;
  $('#scoreStudentMeta').textContent = `${s.grade}年 ${s.attendanceNumber}番　${s.instrument}`;
  updateScoreDisplay();
  renderKeypad();
  renderPresets();
}

function updateScoreDisplay(){
  const disp = $('#scoreDisplay');
  if(state.scoreValue === ''){
    disp.textContent = '--';
    disp.classList.add('empty');
  } else {
    disp.textContent = state.scoreValue + '点';
    disp.classList.remove('empty');
  }
  const n = parseInt(state.scoreValue, 10);
  $('#saveScoreBtn').disabled = !(state.scoreValue !== '' && !Number.isNaN(n) && n >= 0 && n <= 100);
}

function renderPresets(){
  const presets = [60,70,80,90,100];
  $('#presetRow').innerHTML = presets.map(p => `<button data-p="${p}">${p}</button>`).join('');
  $$('#presetRow button').forEach(b => {
    b.onclick = () => { state.scoreValue = b.dataset.p; updateScoreDisplay(); };
  });
}

function renderKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','C','0','⌫'];
  $('#keypad').innerHTML = keys.map(k => `<button data-k="${k}">${k}</button>`).join('');
  $$('#keypad button').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.k;
      if(k === 'C'){ state.scoreValue = ''; }
      else if(k === '⌫'){ state.scoreValue = state.scoreValue.slice(0, -1); }
      else {
        const next = state.scoreValue + k;
        if(next.length > 3) return;
        const n = parseInt(next, 10);
        if(n > 100) return;
        state.scoreValue = String(n);
      }
      updateScoreDisplay();
    };
  });
}

$('#saveScoreBtn').onclick = async () => {
  const n = parseInt(state.scoreValue, 10);
  if(Number.isNaN(n) || n < 0 || n > 100) return;
  const studentId = state.currentStudent.id;
  const scoreId = `${state.exam.id}_${studentId}_${state.teacher.id}`;
  const isNew = state.myScores[studentId] === undefined;
  $('#saveScoreBtn').disabled = true;
  $('#saveScoreBtn').textContent = '保存中…';
  try{
    const payload = {
      examId: state.exam.id, studentId, teacherId: state.teacher.id,
      teacherName: state.teacher.teacherName, score: n, updatedAt: serverTimestamp()
    };
    if(isNew) payload.submittedAt = serverTimestamp();
    await setDoc(doc(db,'scores', scoreId), payload, { merge: true });
    toast('保存しました', 'ok');
    goToNextStudent(studentId);
  }catch(err){
    console.error(err);
    toast('保存に失敗しました。通信環境をご確認ください。', 'err');
  }finally{
    $('#saveScoreBtn').disabled = false;
    $('#saveScoreBtn').textContent = '採点を保存';
  }
};

function goToNextStudent(justScoredId){
  const list = state.filteredStudents;
  const idx = list.findIndex(s => s.id === justScoredId);
  for(let i = 1; i <= list.length; i++){
    const cand = list[(idx + i) % list.length];
    if(state.myScores[cand.id] === undefined && cand.id !== justScoredId){
      openScoreScreen(cand.id);
      return;
    }
  }
  showStep('students');
}

$('#backToListBtn').onclick = () => showStep('students');
</script>
</body>
</html>
